<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Employee</title><link rel="stylesheet" href="assets/styles.css"></head><body>
<div class="topbar"><div class="brand" data-brand>Attendance</div><div class="nav"><span id="who"></span><button onclick="DB.logout()">Logout</button></div></div>
<div class="container narrow"><div class="card"><h1 class="android-title">Employee Attendance</h1><p class="android-sub muted">Choose your action, then scan the QR code shown on the restaurant laptop.</p><div id="status" class="notice hidden"></div><a class="btn big" href="scan.html?action=time_in">✅ Time In - Scan QR</a><a class="btn big out" href="scan.html?action=time_out">↩️ Time Out - Scan QR</a><div class="notice warn"><b>Android tip:</b> Use Chrome, allow camera permission, and scan the latest QR from the kiosk screen.</div></div><div class="card"><h2>Today</h2><div id="todayRecord" class="muted">Loading...</div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="assets/config.js"></script><script src="assets/data.js"></script><script src="assets/app.js"></script><script>
boot().then(async()=>{const u=DB.requireRole('employee'); if(!u) return; setText('who', u.name); const r=await DB.getEmployeeToday(u); todayRecord.innerHTML = r ? `Time In: <b>${DB.toTime(r.timeIn)||'-'}</b><br>Time Out: <b>${DB.toTime(r.timeOut)||'-'}</b><br>Total Hours: <b>${DB.totalHours(r.timeIn,r.timeOut)||'-'}</b>` : 'No attendance record yet today.';});
</script></body></html>
