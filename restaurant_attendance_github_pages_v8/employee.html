<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Demo</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" data-brand>Restaurant Attendance Demo</div>
    <nav class="nav">
      <span id="who"></span>
      <button type="button" onclick="DB.logout()">Exit Demo</button>
    </nav>
  </header>

  <main class="container narrow">
    <section class="card">
      <span class="pill" data-mode></span>
      <h1 class="android-title">Employee Attendance</h1>
      <p class="android-sub muted">Choose an action, then scan the QR shown on the kiosk screen.</p>

      <div id="status" class="notice hidden" role="status"></div>
      <a class="btn big" href="scan.html?action=time_in">Time In — Scan QR</a>
      <a class="btn big out" href="scan.html?action=time_out">Time Out — Scan QR</a>

      <div class="notice warn">
        Records remain on this device. A scan completed on another phone will not appear on the admin demo in this browser.
      </div>
    </section>

    <section class="card">
      <h2>Today</h2>
      <div id="todayRecord" class="muted">Loading…</div>
    </section>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    boot().then(async () => {
      const user = DB.requireRole('employee');
      if (!user) return;

      setText('who', user.name);
      const record = await DB.getEmployeeToday(user);
      document.getElementById('todayRecord').innerHTML = record
        ? 'Time In: <b>' + (DB.toTime(record.timeIn) || '-') + '</b><br>' +
          'Time Out: <b>' + (DB.toTime(record.timeOut) || '-') + '</b><br>' +
          'Total Hours: <b>' + (DB.totalHours(record.timeIn, record.timeOut) || '-') + '</b>'
        : 'No attendance record yet today.';
    });
  </script>
</body>
</html>
