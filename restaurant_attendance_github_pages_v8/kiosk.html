<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Kiosk QR</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="qr-box">
    <section class="qr-display">
      <span class="pill" data-mode></span>
      <h1 data-brand>Restaurant Attendance Demo</h1>
      <p class="muted">Scan this short-lived QR from the employee demo.</p>
      <div id="qrError" class="notice err hidden" role="alert"></div>
      <div id="qrCanvas" aria-label="Attendance QR code"></div>
      <div id="timer" class="timer">30</div>
      <p class="muted">A new QR is generated automatically.</p>
      <details>
        <summary class="tiny">Manual testing token</summary>
        <p class="tiny" id="tokenText"></p>
      </details>
      <button id="exitKiosk" class="btn secondary" type="button">Exit Kiosk</button>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    let remainingSeconds = 0;

    async function createQr() {
      const seconds = window.APP_CONFIG.qrSeconds || 30;
      const token = randomToken();
      const expiresAt = Date.now() + seconds * 1000;

      await DB.setCurrentQr(token, expiresAt);

      const scanPath = location.pathname.replace('kiosk.html', 'scan.html');
      const scanUrl = new URL(location.origin + scanPath);
      scanUrl.searchParams.set('token', token);
      scanUrl.searchParams.set('expires', String(expiresAt));

      const canvas = document.getElementById('qrCanvas');
      canvas.innerHTML = '';

      if (typeof QRCode === 'undefined') {
        msg('qrError', 'The QR library could not load. Refresh the page or use the manual link.', 'err');
      } else {
        new QRCode(canvas, {
          text: scanUrl.toString(),
          width: 420,
          height: 420,
          correctLevel: QRCode.CorrectLevel.M
        });
      }

      remainingSeconds = seconds;
      setText('timer', remainingSeconds);
      setText('tokenText', scanUrl.toString());
    }

    boot().then(async () => {
      if (localStorage.getItem('kioskOk') !== '1') {
        location.href = 'kiosk-login.html';
        return;
      }

      document.getElementById('exitKiosk').addEventListener('click', () => {
        localStorage.removeItem('kioskOk');
        location.href = 'kiosk-login.html';
      });

      await createQr();
      setInterval(async () => {
        remainingSeconds -= 1;
        setText('timer', Math.max(remainingSeconds, 0));
        if (remainingSeconds <= 0) await createQr();
      }, 1000);
    });
  </script>
</body>
</html>
