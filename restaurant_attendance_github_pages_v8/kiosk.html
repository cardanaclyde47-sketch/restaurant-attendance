<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kiosk QR</title><link rel="stylesheet" href="assets/styles.css"></head><body>
<div class="qr-box"><div class="qr-display"><h1 data-brand>Attendance</h1><p class="muted">Employee scans this QR from their phone.</p><div id="qrCanvas"></div><div id="timer" class="timer">30</div><p class="muted">QR refreshes automatically.</p><p class="tiny" id="tokenText"></p><button class="btn secondary" onclick="localStorage.removeItem('kioskOk');location.href='kiosk-login.html'">Exit Kiosk</button></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="assets/config.js"></script><script src="assets/data.js"></script><script src="assets/app.js"></script><script>
let remain=0;
async function newQr(){ const secs=window.APP_CONFIG.qrSeconds || 30; const token=randomToken(); await DB.setCurrentQr(token, Date.now()+secs*1000); const url=location.origin + location.pathname.replace('kiosk.html','scan.html') + '?token=' + encodeURIComponent(token); qrCanvas.innerHTML=''; new QRCode(qrCanvas, {text:url, width:420, height:420, correctLevel:QRCode.CorrectLevel.M}); remain=secs; tokenText.textContent='Token: '+token; }
boot().then(async()=>{ if(localStorage.getItem('kioskOk')!=='1'){location.href='kiosk-login.html';return;} await newQr(); setInterval(async()=>{remain--; timer.textContent=remain; if(remain<=0) await newQr();},1000);});
</script></body></html>
