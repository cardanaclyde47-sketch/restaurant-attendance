<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose Demo Role</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="container narrow">
    <section class="card">
      <span class="pill" data-mode></span>
      <h1 data-brand>Restaurant Attendance Demo</h1>
      <p class="muted">Choose a role to explore. No username or password is required.</p>

      <div id="alert" class="notice hidden" role="status"></div>

      <button id="adminDemo" class="btn full" type="button">Open Admin Demo</button>
      <button id="employeeDemo" class="btn secondary full" type="button" style="margin-top: 10px;">
        Open Employee Demo
      </button>

      <div class="notice warn">
        This is a browser-only portfolio prototype. Accounts, attendance records, and QR data do not sync between devices.
      </div>

      <a href="index.html">Back to demo home</a>
    </section>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    async function openDemo(role) {
      try {
        const user = await DB.startDemo(role);
        location.href = user.role === 'admin' ? 'admin.html' : 'employee.html';
      } catch (error) {
        msg('alert', error.message, 'err');
      }
    }

    boot().then(() => {
      const current = DB.currentUser();
      if (current) {
        location.href = current.role === 'admin' ? 'admin.html' : 'employee.html';
        return;
      }

      document.getElementById('adminDemo').addEventListener('click', () => openDemo('admin'));
      document.getElementById('employeeDemo').addEventListener('click', () => openDemo('employee'));
    });
  </script>
</body>
</html>
