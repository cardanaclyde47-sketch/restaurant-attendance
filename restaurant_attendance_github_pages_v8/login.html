<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login</title><link rel="stylesheet" href="assets/styles.css"></head><body>
<div class="container narrow"><div class="card"><h1 data-brand>Attendance</h1><p class="muted">Login as admin or employee.</p><div id="alert" class="notice hidden"></div><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" value="admin@restaurant.local"><label>Password</label><input id="password" type="password" autocomplete="current-password" value="admin123"><button class="btn full" style="margin-top:16px">Login</button></form><div class="notice"><b>Test accounts</b><br>Admin: admin@restaurant.local / admin123<br>Employee: juan@restaurant.local / employee123</div><div class="notice warn"><b>Note:</b> In Local Demo Mode, new employees only exist in this same browser. Use Firebase Online Mode for phone/laptop sharing.</div><p class="tiny" data-mode></p></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="assets/config.js"></script><script src="assets/data.js"></script><script src="assets/app.js"></script><script>
boot().then(()=>{
  const u=DB.currentUser(); if(u){ location.href = u.role==='admin'?'admin.html':'employee.html'; }
  document.getElementById('loginForm').addEventListener('submit', async e=>{e.preventDefault(); try{ const user=await DB.login(email.value,password.value); location.href=user.role==='admin'?'admin.html':'employee.html'; }catch(err){ msg('alert', err.message, 'err'); }});
});
</script></body></html>
